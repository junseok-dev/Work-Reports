<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주간 진단 리포트 항목 정의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --paper:#fbfcfb; --ink:#14201f; --ink-2:#3d504d; --muted:#5f7370;
  --rule:#dde5e3; --rule-soft:#eaf0ee; --panel:#f3f7f5;
  --calc:#17857f; --calc-bg:#e3f2ef;
  --src:#a8621a;  --src-bg:#f8eede;
  --warn:#a3341f;
  --ok:#1a7a4a;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101817; --ink:#e6efec; --ink-2:#b3c4c0; --muted:#8ba49f;
    --rule:#243230; --rule-soft:#1b2624; --panel:#182220;
    --calc:#4fd0c4; --calc-bg:#12302d;
    --src:#e0a05c;  --src-bg:#2e2113;
    --warn:#f0836a;
    --ok:#5ed392;
  }
}
:root[data-theme="dark"]{
  --paper:#101817; --ink:#e6efec; --ink-2:#b3c4c0; --muted:#8ba49f;
  --rule:#243230; --rule-soft:#1b2624; --panel:#182220;
  --calc:#4fd0c4; --calc-bg:#12302d;
  --src:#e0a05c;  --src-bg:#2e2113;
  --warn:#f0836a;
  --ok:#5ed392;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  line-height:1.65; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:52rem; margin:0 auto; padding:3.5rem 1.5rem 5rem}
code{
  font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:.86em;
  background:var(--rule-soft); padding:.08rem .3rem; border-radius:2px; word-break:break-word;
}

h1{font-size:clamp(1.75rem,4vw,2.3rem); font-weight:600; line-height:1.2; letter-spacing:-.02em; margin:0 0 .6rem; text-wrap:balance}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 .8rem}
.lede{font-size:1rem; color:var(--ink-2); margin:0; max-width:42rem}
.masthead{border-bottom:2px solid var(--ink); padding-bottom:1.5rem; margin-bottom:2rem}

h2{font-size:1.15rem; font-weight:600; letter-spacing:-.015em; margin:2.75rem 0 .9rem; padding-top:1.4rem; border-top:1px solid var(--rule)}
h2.first{border-top:0; padding-top:0; margin-top:0}
h3{font-size:.95rem; font-weight:600; margin:1.6rem 0 .5rem; color:var(--ink)}
p{margin:0 0 .7rem; color:var(--ink-2); font-size:.92rem; max-width:42rem}
b{color:var(--ink); font-weight:600}

.status{display:grid; gap:.75rem; grid-template-columns:repeat(auto-fit,minmax(13rem,1fr)); margin-bottom:2.25rem}
.card{border:1px solid var(--rule); border-left-width:3px; border-radius:2px; padding:.85rem 1rem; background:var(--panel)}
.card.done{border-left-color:var(--ok)}
.card.data{border-left-color:var(--calc)}
.card.todo{border-left-color:var(--warn)}
.card-k{font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:.3rem}
.card-v{font-size:1rem; font-weight:600; color:var(--ink); display:block; line-height:1.35}
.card-s{font-size:.8rem; color:var(--muted); display:block; margin-top:.25rem}

.tag{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:600; letter-spacing:.05em; padding:.1rem .4rem; border-radius:2px; white-space:nowrap; vertical-align:.05em}
.tag.src{background:var(--src-bg); color:var(--src)}
.tag.calc{background:var(--calc-bg); color:var(--calc)}
.tag.off{background:var(--rule-soft); color:var(--muted)}

.tbl{overflow-x:auto; margin:.8rem 0 1.1rem}
table{border-collapse:collapse; width:100%; min-width:30rem; font-size:.88rem}
th,td{text-align:left; padding:.5rem .9rem .5rem 0; border-bottom:1px solid var(--rule-soft); vertical-align:top}
th{font-family:"IBM Plex Mono",monospace; font-size:.66rem; font-weight:500; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule); white-space:nowrap}
td{color:var(--ink-2)}
td.k{color:var(--ink); font-weight:500; white-space:nowrap}
td.n{font-variant-numeric:tabular-nums; white-space:nowrap}
tr.grp td{background:var(--rule-soft); font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.08em; color:var(--muted); font-weight:500}

.note{padding:.75rem 1rem; margin:.9rem 0; font-size:.88rem; background:var(--panel); border-left:3px solid var(--warn); color:var(--ink-2); max-width:42rem}
.note.ok{border-left-color:var(--ok)}
.note p{margin:0; font-size:inherit; max-width:none}
.note p + p{margin-top:.45rem}

pre{font-family:"IBM Plex Mono",monospace; font-size:.78rem; line-height:1.75; color:var(--ink-2); margin:.7rem 0 1rem; padding:.9rem 1.1rem; background:var(--panel); border:1px solid var(--rule); border-radius:2px; overflow-x:auto}

ul{margin:.4rem 0 .9rem; padding-left:1.1rem; color:var(--ink-2); font-size:.92rem; max-width:42rem}
li{margin:.3rem 0}

footer{margin-top:3.5rem; padding-top:1.2rem; border-top:1px solid var(--rule); font-size:.78rem; color:var(--muted)}
footer p{margin:.25rem 0; font-size:inherit; color:inherit}
</style>
</head>
<body>
<div class="wrap">

<header class="masthead">
  <p class="eyebrow">LMS · 수강생 · 강사 · 운영</p>
  <h1>주간 진단 리포트 항목 정의</h1>
  <p class="lede">각 항목이 무엇을 말하고, 어떤 데이터에서 오며, 수강생 공개 화면과 강사·운영 관리 화면에서 어떻게 달라지는지.</p>
</header>

<!--SECTIONS-->

<footer>
  <p>수치는 시연용 시드 데이터 기준입니다.</p>
  <p>AI가 학습 기록을 분석한 참고용 리포트이며, 실제 지도와 피드백은 강사·운영이 함께합니다.</p>
</footer>

</div>
</body>
</html>
